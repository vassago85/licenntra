services:
  app:
    build: .
    ports:
      - "8080:8000"
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: licentra
      DB_USERNAME: licentra
      DB_PASSWORD: licentra
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      CLAMAV_ENABLED: "false"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - documents:/var/www/html/storage/app/private
    depends_on:
      - postgres
      - redis
      - mailpit
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  horizon:
    build: .
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: licentra
      DB_USERNAME: licentra
      DB_PASSWORD: licentra
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - documents:/var/www/html/storage/app/private
    depends_on:
      - postgres
      - redis
    command: ["php", "artisan", "horizon"]

  scheduler:
    build: .
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: licentra
      DB_USERNAME: licentra
      DB_PASSWORD: licentra
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - documents:/var/www/html/storage/app/private
    depends_on:
      - postgres
      - redis
    command: ["php", "artisan", "schedule:work"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licentra
      POSTGRES_USER: licentra
      POSTGRES_PASSWORD: licentra
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: licentra
      MINIO_ROOT_PASSWORD: licentra-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  clamav:
    image: clamav/clamav:stable

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  documents:
  postgres:
  minio:
